<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin sign in</title><link rel="stylesheet" href="/admin/dashboard.css"><link rel="icon" href="/assets/images/brand/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/assets/images/brand/favicon.png" sizes="256x256"></head><body style="display:block;max-width:500px;margin:10vh auto"><article><h1>Website manager</h1><form><label>Admin password<input type="password" required autocomplete="current-password"></label><button>Sign in</button></form><p role="status"></p></article><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('input').value})});if(!r.ok)throw Error((await r.json()).error);location.href='/admin/dashboard.html';}catch(err){document.querySelector('[role=status]').textContent=err.message;}};</script></body></html>
